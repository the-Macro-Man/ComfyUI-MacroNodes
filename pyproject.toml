[project]
name = "macronodes"
version = "1.2.0"
description = "Quality-of-life nodes for ComfyUI, standard library only. Model Name Extractor names your saved files and folders after the model that made them, for use with any save node. Save Image (Macro) does the same while saving, and adds what only a save node can: a workflow .json numbered to match each image, a per-node switch to strip the workflow out of the PNG so you can post pictures without leaking prompts, an optional plain-text summary of model, LoRAs and sampler settings, and path shortening that only acts when a path would actually exceed the Windows limit. Prompt Prefix keeps system prompts as .txt files and offers them as a dropdown, so a different prefix per model is one click instead of a paste. Concat Text joins up to ten inputs, accepts any type so LLM metadata sockets connect without a converter node, and takes a delimiter that can actually hold newlines."
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/the-Macro-Man/ComfyUI-MacroNodes"
"Bug Tracker" = "https://github.com/the-Macro-Man/ComfyUI-MacroNodes/issues"

[tool.comfy]
PublisherId = "the-macroman"
DisplayName = "Macro Nodes"

# The Icon is added here as a deliberate single-variable experiment.
#
# The Registry's YARA scanner flags raw.githubusercontent.com under the
# `contains_blacklisted_url` rule (T1102), and an Icon URL has to point at a
# hosted image - the repo being the obvious place. On comfyui-amdmonitor that
# detection contributed to 11 versions being banned.
#
# 1.0.0 was published with NO Icon so the package contained zero URLs the
# scanner objects to, and it came back Active. That isolates the variable:
# this URL is now the only blacklisted-pattern candidate in the package, which
# otherwise has no network code, no eval/exec/subprocess and no pickle.
#
#   Active  -> raw.githubusercontent.com was never the AMDMonitor trigger.
#   Flagged -> it is, and the Registry's own Icon convention is unusable.
#
# Either result is evidence for Comfy-Org/registry-backend#215. Check the API,
# not the web page - the UI shows a version number before it is verified:
#
#   Invoke-RestMethod "https://api.comfy.org/nodes/macronodes/versions?include_status_reason=true"
Icon = "https://raw.githubusercontent.com/the-Macro-Man/ComfyUI-MacroNodes/main/icon.png"
